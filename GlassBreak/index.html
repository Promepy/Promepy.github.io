
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Break the Glass</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: black;
      overflow: hidden;
    }

    #stage {
      position: fixed;
      inset: 0;
      cursor: url('./hammer.svg?v=2') 20 12, crosshair !important;
    }


    .fracture {
      position: absolute;
      width: 400px;
      height: 300px;
      object-fit: contain;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    #hint {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font: 16px Arial, sans-serif;
      letter-spacing: 1px;
      pointer-events: none;
      animation: fadeOut 5s forwards;
    }

    @keyframes fadeOut {
      0%, 40% { opacity: 0.8; }
      100% { opacity: 0; }
    }
  </style>
</head>

<body>
  <div id="stage"></div>
  <div id="hint">
    Break the Glass | Click your frustration out
  </div>

  <script>
    const stage = document.getElementById("stage");

    stage.addEventListener("click", (event) => {
      const image = document.createElement("img");

      image.className = "fracture";
      image.src = "img/" + (Math.floor(Math.random() * 6) + 1) + ".png";

      image.style.left = event.clientX + "px";
      image.style.top = event.clientY + "px";

      stage.appendChild(image);
    });
  </script>
</body>
</html>
